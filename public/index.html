        <p class="role">Director de Pesquisa, Desenvolvimento e Tecnologia · COPIA Group of Companies, S.A.</p>
        <h1>Edmilson Delfim Praia</h1>
        <p><strong>Geocientista-executivo angolano</strong>. Doutoramento em Geofísica Aplicada pela Universidade Estatal do Petróleo de Ufa, Rússia. Fundador da <strong>EDELPHIA</strong> (Angola) e da <strong>Justificações Acadêmicas</strong>. Criador dos softwares <strong>COPIA Seis</strong>, <strong>COPIA DynamicSim</strong> e <strong>COPIA Quasar</strong>. Speaker em <strong>10 fóruns continentais africanos em 2026</strong>.</p>

        <p class="muted">Contato: <a href="mailto:praiae180@gmail.com">praiae180@gmail.com</a> · WhatsApp <a href="https://wa.me/244933514132">+244 933 514 132</a> · Base: Luanda, Angola · Ufa, Rússia.</p>

        <hr>

        <h2>Empresas</h2>

        <h3>COPIA Group of Companies, S.A. — Director de Pesquisa, Desenvolvimento e Tecnologia (actual)</h3>
        <p>Lidera a agenda de I&amp;D em geociências aplicadas, IA e transformação digital industrial numa das maiores empresas angolanas de engenharia. Responsável pelo desenvolvimento de 3 produtos COPIA. Signatário do protocolo de cooperação com a Associação de Geofísica de Angola (ASGA) em Setembro de 2025. Apoio à expansão regional para a África Austral (escritório Windhoek).</p>

        <h3>EDELPHIA — Fundador (Angola)</h3>
        <p>Empresa de data science e algoritmos sob a assinatura <em>"Science · Algorithms · Intelligence"</em>. Framework em quatro pilares: estimação estatística, minimização de risco em machine learning, inferência causal e acumulação contínua de conhecimento. Equação central <em>Φ = ∫ knowledge · dt</em>. Site: <a href="https://edelphia.vercel.app/">edelphia.vercel.app</a></p>

        <h3>Justificações Acadêmicas — Fundador &amp; CEO (desde 2020)</h3>
        <p>Formação profissional sénior em geociências, engenharia de petróleo e programação Python. Atende profissionais de grandes empresas petrolíferas: Sonangol, Chevron, ANPG. Formação avançada a quadros técnicos sénior de instituições de referência (UAN, UCAN, ISPTEC) — foco em profissionais, não estudantes. Consultoria internacional para Brasil, Líbia e Moçambique. Site: <a href="https://www.justificacoesacademicas.org/">justificacoesacademicas.org</a></p>

        <h3>WellDesk — Analista de Dados / Líder Técnico (actual)</h3>
        <p>Desenvolve soluções avançadas de Machine Learning para análise de dados petrofísicos e geofísicos. Criou a plataforma <strong>Well Log Web Pro</strong>, integrando IA com visualização interativa. Usa Python, Petrel e ECLIPSE.</p>

        <hr>

        <h2>Produtos &amp; Tecnologias (5)</h2>
        <ul>
          <li><strong>COPIA Seis</strong> — Plataforma proprietária de interpretação sísmica assistida por IA. Inclui Geobody Probe, Seismic Horizons e Machine Learning.</li>
          <li><strong>COPIA DynamicSim</strong> — Simulador dinâmico de reservatórios 100% nacional. Interface em português, pagamento em kwanzas. Demonstrado publicamente no AGLNG 2026 em Maputo.</li>
          <li><strong>COPIA Quasar</strong> — Software para análise de infraestruturas críticas nacionais. Apresentado publicamente no MINEA 2026 (Luanda) na palestra "Soberania Tecnológica na Análise de Infraestruturas Críticas Utilizando Software QUASAR".</li>
          <li><strong>Well Log Web Pro</strong> — Plataforma web que integra IA com visualização interativa para análise petrofísica (WellDesk).</li>
          <li><strong>IA PetroChat</strong> — Assistente conversacional de IA generativa para geocientistas e engenheiros de petróleo (pesquisa própria).</li>
        </ul>

        <hr>

        <h2>Formação Académica</h2>
        <ul>
          <li><strong>Doutoramento em Geofísica Aplicada</strong> — Universidade Estatal do Petróleo de Ufa, Rússia</li>
          <li>Especialização em Geologia de Petróleo e Ciência de Dados</li>
          <li>Línguas: Português (nativo), Inglês (fluente), Russo (avançado)</li>
        </ul>

        <hr>

        <h2>Publicações Científicas (COPIA Seis · 2026)</h2>
        <ul>
          <li><strong>"99.9% Locally Right — And Why That Is Not Enough"</strong> (Outubro 2026). The silent cycle skip in seeded 3-D seismic horizon tracking: comparison reference, growth order and access locality. Análise em 619.101 traces do F3 North Sea. <a href="https://www.edmilsondelfimpraia.com/articles/99-9_locally_right.pdf">[PDF]</a></li>
          <li><strong>"1.4 m of Certainty — False Precision in Test-Based Oil-Water Contact Windows"</strong> (Novembro 2026). Como testes mistos de óleo-água definem janelas OWC — e os limites do que os dados do teste podem sustentar. Análise Bayesiana em 19 intervalos tabulados. <a href="https://www.edmilsondelfimpraia.com/articles/1.4m_of_certainty.pdf">[PDF]</a></li>
          <li><strong>"See Before You Pick — Volume Rendering as a Trackability Map"</strong> (Novembro 2026). O que o opacity volume render prevê sobre horizon tracking 3-D — e o que não prevê. <a href="https://www.edmilsondelfimpraia.com/articles/see_before_you_pick.pdf">[PDF]</a></li>
        </ul>
        <p class="muted">Publicações anteriores 2024: 2 artigos revisados por pares em OILFIELD ENGINEERING + 3 artigos técnicos WellDesk + 1 eBook Amazon sobre importação de dados de poços no Petrel.</p>

        <hr>

        <ul>

          <li><strong>MINEA 2026</strong> — 2ª Conferência Internacional sobre Energia e Águas (Luanda HCTA, 28-29 Mai). Speaker + Patrocinador Platina. Lançou publicamente COPIA Quasar.</li>
          <li><strong>AIMCT Angola 2026</strong> — Asset Integrity, Maintenance, Corrosion &amp; Turnaround Conference (Luanda HCTA, 14 Jul). Certificate of Appreciation da Cogent Solutions.</li>
          <li><strong>NOGC 2026</strong> — Namibia Oil &amp; Gas Conference (Windhoek, 18-20 Ago). Speaker + Chairperson.</li>
          <li><strong>Conferência Nacional sobre o Capital Humano</strong> (Luanda, 29 Ago) — UTG/PNFQ · 50 Anos da Independência de Angola.</li>
          <li><strong>AOG 2026</strong> — Angola Oil &amp; Gas (Luanda, 8-10 Set). Três participações: painel oficial, keynote técnico "Reconstruction of Missing RHOB and NPHI Well Logs Using Machine Learning", VIP Breakfast ao lado do Secretário de Estado angolano.</li>
          <li><strong>AHTLS 2026</strong> — Angola Hub Transporte &amp; Logística Summit (Talatona, 29 Set). Workshop "Digitalização, IA e Automação Logística".</li>
          <li><strong>AEW 2026</strong> — African Energy Week (Cape Town, 12 Out). Speaker + Chairperson. "Building Africa's Subsurface Intelligence Through AI-Driven Seismic Interpretation".</li>
          <li><strong>Huawei Luanda Innovation Center</strong> — Masterclass COPIA de IA, ML e Deep Learning aplicados a O&amp;G.</li>
          <li><strong>AGLNG 2026</strong> — Africa Gas &amp; LNG Summit (Maputo, 11-13 Nov). Session 3.1 "Preparing Africa's Workforce for Gas and LNG Projects". Sob patrocínio de H.E. Daniel Chapo, Presidente de Moçambique.</li>
        </ul>

        <hr>

        <h2>Reconhecimentos</h2>
